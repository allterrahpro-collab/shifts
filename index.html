const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr = () => ymd(new Date());

const DAYS_SHORT = ['L','M','M','J','V','S','D'];

const fmtLong  = d => d ? new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}) : '';
const fmtShort = d => d ? new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}) : '';
const fmtRange = (f,t) => !f||!t ? '' : f===t ? fmtShort(f) : 'du '+fmtShort(f)+' au '+fmtShort(t);
const datesInRange = (f,t) => { const a=[]; for(let d=new Date(f+'T00:00:00');d<=new Date(t+'T00:00:00');d.setDate(d.getDate()+1)) a.push(ymd(d)); return a; };
const parseTime = t => { if(!t||typeof t!=='string'||t.indexOf(':')<0)return 0; const[h,m]=t.split(':').map(Number); return (h||0)*60+(m||0); };
const diffH = (s,e) => { const d=parseTime(e)-parseTime(s); return d>0?Math.round(d/6)/10:0; };
const fmtMin = m => { m=Math.max(0,Math.min(24*60,m)); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
const validShift = s => s&&s.employeeId&&s.date&&s.start&&s.end;
const monthKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const monthsBetween = (fromKey,toKey) => { const[fy,fm]=fromKey.split('-').map(Number),[ty,tm]=toKey.split('-').map(Number); return (ty-fy)*12+(tm-fm); };
const mondayKey = ds => { const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d); };
// Jours fériés français (fixes + basés sur Pâques)
const _holiCache={};
function frenchHolidays(year){
  if(_holiCache[year])return _holiCache[year];
  // Pâques (algorithme de Meeus/Butcher)
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  const easter=new Date(year,mo-1,da);
  const add=(base,n)=>{const x=new Date(base);x.setDate(x.getDate()+n);return ymd(x);};
  const o={};
  o[year+'-01-01']='Jour de l\'An';o[year+'-05-01']='Fête du Travail';o[year+'-05-08']='Victoire 1945';
  o[year+'-07-14']='Fête nationale';o[year+'-08-15']='Assomption';o[year+'-11-01']='Toussaint';
  o[year+'-11-11']='Armistice';o[year+'-12-25']='Noël';
  o[add(easter,1)]='Lundi de Pâques';o[add(easter,39)]='Ascension';o[add(easter,50)]='Lundi de Pentecôte';
  _holiCache[year]=o;return o;
}
const holidayName = ds => ds?(frenchHolidays(+ds.slice(0,4))[ds]||''):'';
// Hachage du mot de passe (SHA-256 si dispo, sinon repli simple)
async function hashPw(s){
  try{ if(window.crypto&&crypto.subtle){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cs:'+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); } }catch(e){}
  let h=5381; for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0; return 'f'+h.toString(16);
}
const isWeekend = ds => { const d=new Date(ds+'T00:00:00').getDay(); return d===0||d===6; };
const weekNum = ds => { const d=new Date(ds+'T00:00:00'); d.setHours(0,0,0,0); d.setDate(d.getDate()+3-(d.getDay()+6)%7); const w=new Date(d.getFullYear(),0,4); return 1+Math.round(((d-w)/86400000-(3-(w.getDay()+6)%7))/7); };

  {id:'magda',   name:'Magda',   role:'employee',email:'magda@cafe.fr',    hoursPerWeek:35,cpBalance:1.08, wage:18.20, contractType:'CDI',       hasAteliers:false},
  {id:'santiago',name:'Santiago',role:'employee',email:'santiago@cafe.fr', hoursPerWeek:24,cpBalance:12,   wage:13.46, contractType:'CDI',       hasAteliers:true },

  {id:'myriam',  name:'Myriam',  role:'employee',email:'myriam@cafe.fr',   hoursPerWeek:28,cpBalance:5,    wage:18.75, contractType:'CDI',       hasAteliers:false},
  {id:'eliott',  name:'Eliott',  role:'employee',email:'eliott@cafe.fr',   hoursPerWeek:0, cpBalance:0,    wage:0,     contractType:'Freelance', hasAteliers:false, cpRate:0},
  {id:'cristina',name:'Cristina',role:'employee',email:'cristina@cafe.fr', hoursPerWeek:35,cpBalance:9.67, wage:9.42,  contractType:'Alternance',hasAteliers:false},

const PATTERN=[
  [1,'myriam',  '07:30','15:00'],[1,'magda',   '11:00','15:30'],
  [2,'myriam',  '07:30','15:00'],[2,'santiago','09:00','17:30'],
  [3,'santiago','09:00','15:00'],[3,'orianna', '11:00','18:30'],

  [6,'orianna', '08:30','16:30'],[6,'myriam',  '09:00','14:00'],[6,'mathis','10:00','18:00'],[6,'magda','14:00','18:00'],
  [0,'myriam',  '08:30','16:30'],[0,'mathis',  '10:00','18:00'],[0,'magda', '10:00','18:00'],
];
// Modèle de semaine par défaut (lun=0 … dim=6) dérivé du PATTERN
const SEED_TEMPLATE = PATTERN.map(p=>({dow:(p[0]===0?6:p[0]-1),employeeId:p[1],start:p[2],end:p[3]}));

function generateShifts(){
  const s=[];
  const start=new Date('2026-05-01'),end=new Date('2026-09-30'); // extended to Sept
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const dow=d.getDay(),ds=ymd(d);
    PATTERN.filter(p=>p[0]===dow).forEach(p=>s.push({id:uid(),employeeId:p[1],date:ds,start:p[2],end:p[3]}));
  }
  return s;
}

createApp({
  data(){
    initStorage();
    return{
      user:null, loginForm:{username:'',password:'',password2:'',err:''},
      view:'planning',
      users:        LS.get('users')        ||[],
      shifts:       LS.get('shifts')       ||[],
      requests:     LS.get('requests')     ||[],
      notifications:LS.get('notifications')||[],
      ateliers:     LS.get('ateliers')     ||[],
      tips:         LS.get('tips')         ||[],
      corpo:        LS.get('corpo')        ||[],
      weekTemplate: LS.get('weekTemplate') ||SEED_TEMPLATE,
      demoMode:     LS.get('demoMode')!==false,   // démo par défaut tant que non désactivé
      purgeDate:    '2026-07-31',                  // limite du planning (outil admin)
      cpPerMonth:   LS.get('cpPerMonth')   ??2.5,  // jours de CP gagnés par mois travaillé
      // corpo (Orianna)
      corpoYear:new Date().getFullYear(), corpoMonth:new Date().getMonth(), corpoAddDate:todayStr(),
      // planning
      planView:'month',
      planYear:new Date().getFullYear(), planMonth:new Date().getMonth(),
      weekOffset:0,
      // day modal
      showDay:false, dayDate:null,
      // shift modal
      showShift:false, editShift:null,
      shiftForm:{employeeId:'',date:'',start:'',end:''},
      // spreadsheet
      selectedCell:null, editingCell:null,
      cellForm:{start:'',end:''},
      clipboard:null, copiedCell:null,
      selDays:[], daysClip:null, copiedDay:null, weekJump:'',
      // agenda shift selection / clipboard
      selShiftId:null, shiftClip:null, targetCell:null, dragShiftId:null,
      // leave / requests
      reqTab:'conges',
      showLeave:false, leaveForm:{dateFrom:'',dateTo:'',type:'CP',note:''},
      // suggestions
      suggestions:  LS.get('suggestions') ||[],
      showSugg:false, suggForm:{kind:'shift',date:todayStr(),shiftId:'',start:'',end:'',title:'',atelierType:'atelier',hours:2,note:''},
      showWA:false, waMsg:'',
      showNotif:false,
      // admin
      editEmp:null, empForm:{},
      showNewEmp:false, newEmp:{},
      // reports
      repYear:new Date().getFullYear(), repMonth:new Date().getMonth(),
      repTab:'heures',   // 'heures' | 'pourboires'
      tipsInput:'',
      // ateliers
      showAtForm:false, editAt:null,
      atForm:{employeeId:'santiago',date:todayStr(),title:'',hours:2,type:'atelier',note:''},
      atYear:new Date().getFullYear(), atMonth:new Date().getMonth(),
      // undo / redo
      history:[], histIdx:-1, histLock:false,
      // sync cloud
      online:false,
      MONTHS, DAYS_SHORT,
    };
  },

  computed:{
    isManager() {return this.user?.role==='manager';},
    isPatron()  {return this.user?.role==='patron';},
    isEmployee(){return this.user?.role==='employee';},
    canEdit()   {return this.isManager;},
    canAdmin()  {return this.isManager||this.isPatron;},
    isCorpo()   {return this.user?.id==='orianna';},
    firstLogin(){if(this.demoMode)return false;const id=(this.loginForm.username||'').toLowerCase().trim();const u=this.users.find(x=>x.id===id);return !!u&&!u.password;},
    canUndo()   {return this.histIdx>0;},
    canRedo()   {return this.histIdx>=0&&this.histIdx<this.history.length-1;},
    employees() {return this.users.filter(u=>u.role==='employee');},
    showAteliers(){ return !!this.user; },   // chacun peut consulter/ajouter ses ateliers
    unread()    {return this.notifications.filter(n=>n.userId===this.user?.id&&!n.read).length;},
    myNotifs()  {return[...this.notifications].filter(n=>n.userId===this.user?.id).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,30);},

    // ─── Calendar ───
    calDays(){
      const days=[];
      const first=new Date(this.planYear,this.planMonth,1),last=new Date(this.planYear,this.planMonth+1,0);
      let sd=first.getDay();sd=sd===0?6:sd-1;
      for(let i=0;i<sd;i++){const d=new Date(this.planYear,this.planMonth,1-sd+i);days.push({ds:ymd(d),cur:false});}
      for(let d=1;d<=last.getDate();d++) days.push({ds:ymd(new Date(this.planYear,this.planMonth,d)),cur:true});
      while(days.length%7!==0){const n=days.length-last.getDate()-sd+1;days.push({ds:ymd(new Date(this.planYear,this.planMonth+1,n)),cur:false});}
      return days;
    },
    shiftsMap(){
      const m={};
      this.shifts.forEach(s=>{(m[s.date]||(m[s.date]=[])).push(s);});
      return m;
    },
    dayShifts(){
      if(!this.dayDate)return[];
      return[...(this.shiftsMap[this.dayDate]||[])].sort((a,b)=>a.start.localeCompare(b.start));
    },

    // ─── Week grid ───
    weekDays(){
      const base=new Date(),dow=base.getDay(),back=dow===0?6:dow-1;
      const mon=new Date(base);mon.setDate(base.getDate()-back+this.weekOffset*7);
      return Array.from({length:7},(_,i)=>{
        const d=new Date(mon);d.setDate(mon.getDate()+i);
        const ds=ymd(d);
        return{ds,num:d.getDate(),name:d.toLocaleDateString('fr-FR',{weekday:'short'}),
          isToday:ds===todayStr(),isWeekend:d.getDay()===0||d.getDay()===6,month:d.getMonth()};
      });
    },
    weekLabel(){
      if(!this.weekDays.length)return'';
      const f=this.weekDays[0],l=this.weekDays[6];
      const fd=new Date(f.ds+'T00:00:00'),ld=new Date(l.ds+'T00:00:00');
      const wn=weekNum(f.ds);
      const label=fd.getMonth()===ld.getMonth()
        ? fd.getDate()+' – '+ld.getDate()+' '+MONTHS[ld.getMonth()]+' '+ld.getFullYear()
        : fd.getDate()+' '+MONTHS[fd.getMonth()]+' – '+ld.getDate()+' '+MONTHS[ld.getMonth()]+' '+ld.getFullYear();
      return `Sem. ${wn} · ${label}`;
    },
    // Hour rows for the agenda grid — auto-fit to the week's shifts (fallback 7h–19h)
    weekHours(){
      let min=24,max=0;
      this.weekDays.forEach(d=>{(this.shiftsMap[d.ds]||[]).forEach(s=>{
        const sh=Math.floor(parseTime(s.start)/60), eh=Math.ceil(parseTime(s.end)/60);
        if(sh<min)min=sh; if(eh>max)max=eh;
      });});
      if(min>=max){min=7;max=19;} else {min=Math.min(min,7);max=Math.max(max,19);}
      const arr=[]; for(let h=min;h<max;h++)arr.push(h); return arr;
    },
    selectedShift(){ return this.selShiftId ? (this.shifts.find(s=>s.id===this.selShiftId)||null) : null; },
    // Coût de la semaine affichée
    weekCost(){
      let c=0;
      this.employees.forEach(emp=>{
        const wh=this.weekDays.reduce((s,d)=>s+(this.shiftsMap[d.ds]||[]).filter(x=>x.employeeId===emp.id).reduce((a,x)=>a+diffH(x.start,x.end),0),0);
        const paid=Math.max(wh,+emp.hoursPerWeek||0);   // jamais moins que le contractuel hebdo
        c+=paid*(+emp.wage||0);
      });
      return Math.round(c);
    },
    // Alertes repos légal pour la semaine affichée
    legalWarnings(){
      const out=[],days=this.weekDays;
      this.employees.forEach(emp=>{
        const ss=[];
        days.forEach((d,i)=>{(this.shiftsMap[d.ds]||[]).filter(s=>s.employeeId===emp.id).forEach(s=>ss.push({i,startAbs:i*1440+parseTime(s.start),endAbs:i*1440+parseTime(s.end)}));});
        ss.sort((a,b)=>a.startAbs-b.startAbs);
        const msgs=[];
        for(let j=1;j<ss.length;j++){const gap=ss[j].startAbs-ss[j-1].endAbs;if(gap>0&&gap<660){msgs.push('repos < 11h');break;}}
        const dw=[...new Set(ss.map(s=>s.i))].sort((a,b)=>a-b);
        let run=dw.length?1:0,mx=run;for(let j=1;j<dw.length;j++){run=dw[j]===dw[j-1]+1?run+1:1;if(run>mx)mx=run;}
        if(mx>6)msgs.push('> 6 jours consécutifs');
        const total=days.reduce((s,d)=>s+(this.shiftsMap[d.ds]||[]).filter(x=>x.employeeId===emp.id).reduce((a,x)=>a+diffH(x.start,x.end),0),0);
        if(total>48)msgs.push((Math.round(total*10)/10)+'h > 48h/sem');
        if(msgs.length)out.push({id:emp.id,name:emp.name,msgs});
      });
      return out;
    },

    // ─── Requests ───
    myRequests(){
      const all=[...this.requests].sort((a,b)=>(b.dateFrom||b.date||'').localeCompare(a.dateFrom||a.date||''));
      if(this.canEdit||this.isPatron)return all;
      return all.filter(r=>r.employeeId===this.user?.id);
    },
    pendingSwaps(){
      if(!this.user)return[];
      return this.requests.filter(r=>r.status==='pending_swap'&&r.proposedTo?.includes(this.user.id)&&!r.swapDecisions?.[this.user.id]);
    },
    // Shifts à remplacer que l'utilisateur peut prendre (pas de chevauchement ni de congé)
    openShifts(){
      if(!this.user)return[];
      return this.requests.filter(r=>{
        if(!['pending_swap','needs_manager'].includes(r.status))return false;
        if(r.employeeId===this.user.id)return false;
        const sh=this.shifts.find(s=>s.id===r.myShiftId);
        if(!sh||sh.employeeId!==r.employeeId)return false;          // shift déjà repris / disparu
        const date=r.dateFrom||r.date;
        const clash=(this.shiftsMap[date]||[]).some(s=>s.employeeId===this.user.id&&parseTime(s.start)<parseTime(sh.end)&&parseTime(s.end)>parseTime(sh.start));
        return !clash && !this.onLeave(this.user.id,date);          // OK si aucun chevauchement et pas en congé ce jour-là
      }).sort((a,b)=>(a.dateFrom||a.date||'').localeCompare(b.dateFrom||b.date||''));
    },
    visibleSuggestions(){
      const all=[...this.suggestions].sort((a,b)=>(b.at||'').localeCompare(a.at||''));
      if(this.canEdit||this.isPatron)return all;
      return all.filter(s=>s.employeeId===this.user?.id);
    },
    pendingSuggCount(){return this.suggestions.filter(s=>s.status==='pending').length;},
    myUpcomingShifts(){
      const t=todayStr();
      return this.shifts.filter(s=>s.employeeId===this.user?.id&&s.date>=t).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));
    },
    // Shifts ajustables : à venir + passés récents (120 j), le plus récent en haut
    myShiftsForSugg(){
      const min=new Date();min.setDate(min.getDate()-120);const lo=ymd(min);
      return this.shifts.filter(s=>s.employeeId===this.user?.id&&s.date>=lo).sort((a,b)=>b.date.localeCompare(a.date)||b.start.localeCompare(a.start));
    },

    // ─── Reports: hours ───
    reportData(){
      const{repYear:y,repMonth:m}=this;
      const pool=this.isEmployee?this.employees.filter(e=>e.id===this.user.id):this.employees;
      return pool.map(emp=>{
        const ws=this.shifts.filter(s=>{const d=new Date(s.date);return s.employeeId===emp.id&&d.getFullYear()===y&&d.getMonth()===m;});
        const shiftH=ws.reduce((s,x)=>s+diffH(x.start,x.end),0);
        // heures corpo (comptées dans le décompte)
        const corpoH=this.corpo.filter(c=>{const d=new Date(c.date);return c.employeeId===emp.id&&d.getFullYear()===y&&d.getMonth()===m;}).reduce((s,c)=>s+diffH(c.start,c.end),0);
        // ateliers VALIDÉS (les ateliers en attente ne comptent pas)
        const atH=this.ateliers.filter(a=>{const d=new Date(a.date);return a.employeeId===emp.id&&a.pending!==true&&d.getFullYear()===y&&d.getMonth()===m;}).reduce((s,a)=>s+(+a.hours||0),0);
        const worked=shiftH+corpoH+atH;   // shifts + corpo + ateliers
        const contract=Math.round((emp.hoursPerWeek||0)*(52/12)*10)/10;   // mensualisation légale 52/12 (référence)
        const extra=this.weeklyExtra(emp.id,y,m);   // heures sup/compl. comptées À LA SEMAINE
        const approved=this.requests.filter(r=>{const d=new Date(r.dateFrom||r.date||'');return r.employeeId===emp.id&&r.status==='approved'&&d.getFullYear()===y&&d.getMonth()===m;});
        return{emp,worked:Math.round(worked*10)/10,contract:Math.round(contract*10)/10,delta:Math.round((worked-contract)*10)/10,extra,
          cpUsed:approved.filter(r=>r.type==='CP'&&r.cp!==false).length,ssCount:approved.filter(r=>r.type==='sans_solde').length,malCount:approved.filter(r=>r.type==='maladie').length,
          atHours:Math.round(atH*10)/10,corpoHours:Math.round(corpoH*10)/10,cost:Math.round(Math.max(worked,contract)*(+emp.wage||0))};
      });
    },

    // ─── Reports: tips ───
    tipsData(){
      const{repYear:y,repMonth:m}=this;
      const entry=this.tips.find(t=>t.year===y&&t.month===m);
      const total=entry?+entry.amount:0;

      const empData=this.employees.map(emp=>{
        const ws=this.shifts.filter(s=>{const d=new Date(s.date);return s.employeeId===emp.id&&d.getFullYear()===y&&d.getMonth()===m;});
        const wkndH=Math.round(ws.filter(s=>isWeekend(s.date)).reduce((a,x)=>a+diffH(x.start,x.end),0)*10)/10;
        const wkdyH=Math.round(ws.filter(s=>!isWeekend(s.date)).reduce((a,x)=>a+diffH(x.start,x.end),0)*10)/10;
        const weighted=Math.round((wkdyH+wkndH*2)*10)/10;   // weekend ×2
        return{emp,wkndH,wkdyH,weighted};
      }).filter(d=>d.weighted>0);

      const totalW=empData.reduce((s,d)=>s+d.weighted,0);
      const coef=totalW>0?total/totalW:0;   // total distribué = total récolté

      return{
        total,hasData:total>0,
        coefWkdy:Math.round(coef*100)/100,
        coefWknd:Math.round(coef*2*100)/100,
        totalW:Math.round(totalW*10)/10,
        employees:empData.map(d=>({...d,share:Math.round(d.weighted*coef*100)/100})),
      };
    },

    // ─── Ateliers ───
    filteredAteliers(){
      const{atYear:y,atMonth:m}=this;
      let list=this.ateliers.filter(a=>{const d=new Date(a.date);return d.getFullYear()===y&&d.getMonth()===m;});
      if(this.isEmployee) list=list.filter(a=>a.employeeId===this.user?.id);
      return list.sort((a,b)=>a.date.localeCompare(b.date));
    },
    atLabel(){const{atYear:y,atMonth:m}=this;return MONTHS[m]+' '+y;},
    // ─── Corpo (Orianna) ───
    corpoList(){
      const{corpoYear:y,corpoMonth:m}=this;
      return this.corpo
        .filter(c=>{const d=new Date(c.date);return c.employeeId==='orianna'&&d.getFullYear()===y&&d.getMonth()===m;})
        .sort((a,b)=>a.date.localeCompare(b.date));
    },
    corpoLabel(){const{corpoYear:y,corpoMonth:m}=this;return MONTHS[m]+' '+y;},
    corpoTotal(){return Math.round(this.corpoList.reduce((s,c)=>s+diffH(c.start,c.end),0)*10)/10;},
  },

  mounted(){
    this.initHistory();
    window.addEventListener('keydown',this._kd=this.handleKeydown.bind(this));
    // Synchro live entre onglets du même navigateur : recharge quand un autre onglet écrit
    window.addEventListener('storage',this._st=(e)=>{ if(e.key&&e.key.indexOf('cs5_')===0){ this.reload(true); } });
    // Synchro cloud (Supabase) : on lit le cloud AVANT toute écriture (sinon on écraserait le cloud avec la démo locale)
    if(supa){ this.initRemote(); }
    else { this._afterLoad(); }
  },
  beforeUnmount(){window.removeEventListener('keydown',this._kd);window.removeEventListener('storage',this._st);},

  methods:{
    // ── Auth ──
    async login(){
      this.reload(true);   // repart des données à jour (autres onglets inclus)
      const id=this.loginForm.username.toLowerCase().trim();
      const u=this.users.find(x=>x.id===id);
      if(!u){this.loginForm.err='Identifiant inconnu.';return;}
      if(this.demoMode){this._enter(u);return;}   // mode démo : pas de mot de passe
      const pw=this.loginForm.password||'';
      if(!u.password){
        // Première connexion : l'utilisateur choisit son mot de passe
        if(pw.length<4){this.loginForm.err='Première connexion : choisis un mot de passe (4 caractères min).';return;}
        if(pw!==this.loginForm.password2){this.loginForm.err='Les deux mots de passe ne correspondent pas.';return;}
        u.password=await hashPw(pw);this.commit();
        this._enter(u);
      } else {
        if(await hashPw(pw)===u.password)this._enter(u);
        else this.loginForm.err='Mot de passe incorrect.';
      }
    },
    _enter(u){this.user=u;this.loginForm={username:'',password:'',password2:'',err:''};if(this.isPatron)this.view='reports';},
    logout(){this.user=null;this.view='planning';this.showDay=false;this.editingCell=null;this.selectedCell=null;this.selDays=[];},
    goTo(v){this.view=v;this.showDay=false;this.showNotif=false;this.editingCell=null;this.selectedCell=null;this.selDays=[];},

    // ── Persistence + Undo/Redo ──
    save(){DB_KEYS.forEach(k=>LS.set(k,this[k]));this.pushRemote();},
    snapshot(){const o={};HIST_KEYS.forEach(k=>o[k]=JSON.parse(JSON.stringify(this[k])));return o;},
    applySnap(s){HIST_KEYS.forEach(k=>{if(s[k]!=null)this[k]=JSON.parse(JSON.stringify(s[k]));});this.save();},
    initHistory(){this.history=[this.snapshot()];this.histIdx=0;},
    // Recharge les données depuis localStorage (login + synchro inter-onglets)
    reload(resetHist){
      DB_KEYS.forEach(k=>{const v=LS.get(k);if(v!=null)this[k]=v;});
      if(this.user){const u=this.users.find(x=>x.id===this.user.id);if(u)this.user=u;}
      if(resetHist)this.initHistory();
    },
    // Retire les shifts incomplets (horaire manquant) qui faisaient planter les calculs
    sanitize(){
      const before=this.shifts.length;
      this.shifts=this.shifts.filter(validShift);
      if(this.shifts.length!==before)this.commit();
    },
    // Acquisition automatique des CP : +cpPerMonth par mois écoulé, idempotent via cpAccruedThru
    cpRateOf(u){return u.cpRate!=null?(+u.cpRate||0):(+this.cpPerMonth||0);},
    accrueCP(){
      const cur=monthKey(new Date()); let changed=false;
      this.users.forEach(u=>{
        if(u.role==='patron')return;
        if(!u.cpAccruedThru){ u.cpAccruedThru=cur; changed=true; return; }   // 1er lancement : pas de rétroactif
        const n=monthsBetween(u.cpAccruedThru,cur);
        if(n>0){
          const rc=this.cpRateOf(u);
          if(rc>0)u.cpBalance=Math.round(((u.cpBalance||0)+rc*n)*10)/10;
          u.cpAccruedThru=cur; changed=true;
        }
      });
      if(changed)this.commit();
    },

    // ── Synchro Supabase ──
    // Traitements post-chargement (nettoyage, acquisition CP, historique). _ready autorise enfin les écritures cloud.
    _afterLoad(){ this._ready=true; this.sanitize(); this.normalizeCpRate(); this.accrueCP(); this.migrateLeaveTypes(); this.initHistory(); },
    // Migration unique : acquisition fixée à 2,5 j/mois pour chaque salarié (0 pour les freelances). Idempotent via cpRateNorm.
    normalizeCpRate(){
      let changed=false;
      this.users.forEach(u=>{
        if(u.cpRateNorm)return;
        if(u.role!=='patron') u.cpRate = (u.contractType==='Freelance') ? 0 : 2.5;
        u.cpRateNorm=true; changed=true;
      });
      if(changed)this.commit();
    },
    // Migration unique : « sans solde » -> CP (déduit les jours déjà accordés). Idempotent (plus de sans_solde après).
    migrateLeaveTypes(){
      let changed=false;
      this.requests.forEach(r=>{
        if(r.type==='sans_solde'){
          r.type='CP';changed=true;
          if(r.status==='approved'){const n=datesInRange(r.dateFrom||r.date,r.dateTo||r.dateFrom||r.date).length;this.adjustLeave(r.employeeId,'CP',-n);}
        }
      });
      if(changed)this.commit();
    },
    initRemote(){
      if(!supa){this._afterLoad();return;}
      supa.from('app_state').select('k,data').then(({data,error})=>{
        if(error){console.warn('Supabase load',error);this.online=false;this._afterLoad();return;}
        if(data&&data.length){
          data.forEach(r=>{if(DB_KEYS.includes(r.k)&&r.data!=null){this[r.k]=r.data;LS.set(r.k,r.data);this._markPushed(r.k);}});
          this.fixUserRef();this.online=true;
          this._afterLoad();                 // écritures autorisées seulement maintenant (après lecture du cloud)
        } else {
          this.online=true;
          this._afterLoad();                 // base vide → on autorise puis on envoie l'état de départ
          this._doPush();
        }
        supa.channel('cs_state')
          .on('postgres_changes',{event:'*',schema:'public',table:'app_state'},()=>this.schedulePull())
          .subscribe();
      });
    },
    fixUserRef(){if(this.user){const u=this.users.find(x=>x.id===this.user.id);if(u)this.user=u;}},
    schedulePull(){clearTimeout(this._pullT);this._pullT=setTimeout(()=>this.pullRemote(),300);},
    pullRemote(){
      if(!supa)return;
      supa.from('app_state').select('k,data').then(({data,error})=>{
        if(error){this.online=false;return;}
        (data||[]).forEach(r=>{if(DB_KEYS.includes(r.k)&&r.data!=null){this[r.k]=r.data;LS.set(r.k,r.data);this._markPushed(r.k);}});
        this.fixUserRef();this.online=true;
      });
    },
    _markPushed(k){this._pushed=this._pushed||{};this._pushed[k]=JSON.stringify(this[k]);},
    pushRemote(){if(!supa)return;clearTimeout(this._pushT);this._pushT=setTimeout(()=>this._doPush(),250);},
    _doPush(){
      if(!supa||!this._ready)return;   // jamais d'écriture avant la 1re lecture du cloud
      this._pushed=this._pushed||{};
      const rows=[];
      DB_KEYS.forEach(k=>{const j=JSON.stringify(this[k]);if(j!==this._pushed[k]){rows.push({k,data:this[k],updated_at:new Date().toISOString()});this._pushed[k]=j;}});
      if(!rows.length)return;   // ne pousse QUE ce qui a changé localement
      supa.from('app_state').upsert(rows).then(({error})=>{this.online=!error;if(error)console.warn('Supabase save',error);});
    },
    commit(){
      this.save();
      if(this.histLock)return;
      this.history=this.history.slice(0,this.histIdx+1);
      this.history.push(this.snapshot());
      if(this.history.length>60){this.history.shift();}
      this.histIdx=this.history.length-1;
    },
    undo(){
      if(this.histIdx<=0)return;
      this.histLock=true;this.histIdx--;this.applySnap(this.history[this.histIdx]);this.histLock=false;
      this.clearSel();
    },
    redo(){
      if(this.histIdx>=this.history.length-1)return;
      this.histLock=true;this.histIdx++;this.applySnap(this.history[this.histIdx]);this.histLock=false;
      this.clearSel();
    },

    // ── Month nav ──
    prevMonth(){if(this.planMonth===0){this.planMonth=11;this.planYear--;}else this.planMonth--;},
    nextMonth(){if(this.planMonth===11){this.planMonth=0;this.planYear++;}else this.planMonth++;},
    dayShiftsFor(ds){
      return this.shiftsMap[ds]||[];   // tout le monde voit le planning complet (qui travaille avec qui)
    },
    openDay(ds){this.dayDate=ds;this.showDay=true;},
    closeDay(){this.showDay=false;this.dayDate=null;},
    isToday(ds){return ds===todayStr();},

    // ── Week nav ──
    prevWeek(){this.weekOffset--;this.clearSel();},
    nextWeek(){this.weekOffset++;this.clearSel();},
    jumpMonth(delta){
      const monOf=d=>{const x=new Date(d);const dw=x.getDay(),b=dw===0?6:dw-1;x.setDate(x.getDate()-b);x.setHours(0,0,0,0);return x;};
      const cur=new Date(this.weekDays[0].ds+'T00:00:00');cur.setMonth(cur.getMonth()+delta);
      const target=monOf(cur),base=monOf(new Date());
      this.weekOffset=Math.round((target-base)/(7*864e5));this.clearSel();
    },
    goToday(){this.weekOffset=0;},
    clearSel(){this.selectedCell=null;this.editingCell=null;this.selDays=[];this.selShiftId=null;this.targetCell=null;},

    // ── Cell helpers ──
    shiftForCell(empId,date){return(this.shiftsMap[date]||[]).find(s=>s.employeeId===empId)||null;},
    // ── Agenda (hours × days) ──
    hourLabel(h){return String(h).padStart(2,'0')+'h';},
    shiftsAt(date,hour){
      const lo=hour*60, hi=(hour+1)*60;
      const list=(this.shiftsMap[date]||[]).filter(s=>parseTime(s.start)<hi&&parseTime(s.end)>lo);
      return list.sort((a,b)=>a.start.localeCompare(b.start));   // tout le monde voit qui travaille
    },
    isShiftStart(s,hour){return Math.floor(parseTime(s.start)/60)===hour;},
    isSelShift(s){return this.selShiftId===s.id;},
    pickShift(s){if(!this.canEdit)return;this.selDays=[];this.targetCell=null;this.selShiftId=s.id;},
    copyShiftSel(){const s=this.selectedShift;if(s){this.shiftClip={employeeId:s.employeeId,start:s.start,end:s.end};}},
    deleteSelShift(){const s=this.selectedShift;if(s){this.shifts=this.shifts.filter(x=>x.id!==s.id);this.selShiftId=null;this.commit();}},
    // Une personne ne peut pas se chevaucher avec elle-même
    overlaps(empId,date,start,end,exceptId){
      const st=parseTime(start),en=parseTime(end);
      return (this.shiftsMap[date]||[]).some(s=>s.employeeId===empId&&s.id!==exceptId&&parseTime(s.start)<en&&parseTime(s.end)>st);
    },
    // Absence validée de l'employé ce jour-là ?
    onLeave(empId,date){
      return this.requests.some(r=>r.employeeId===empId&&r.status==='approved'&&date>=(r.dateFrom||r.date)&&date<=(r.dateTo||r.dateFrom||r.date));
    },
    holiday(ds){return holidayName(ds);},
    // Garde commune avant de placer/déplacer un shift
    canPlace(empId,date,start,end,exceptId){
      if(this.overlaps(empId,date,start,end,exceptId)){alert(this.empName(empId)+' a déjà un shift qui chevauche ce créneau.');return false;}
      if(this.onLeave(empId,date)){alert(this.empName(empId)+' est en absence validée le '+fmtShort(date)+'.');return false;}
      return true;
    },
    // Clic sur une case vide = la sélectionner comme cible (pour ajouter / coller)
    agendaCellClick(date,hour){
      if(!this.canEdit)return;
      this.selShiftId=null;this.selDays=[];
      this.targetCell={date,hour};
    },
    pasteShiftTo(date,hour){
      if(!this.shiftClip)return;
      const dur=parseTime(this.shiftClip.end)-parseTime(this.shiftClip.start);
      const start=fmtMin(hour*60), end=fmtMin(hour*60+dur);
      if(!this.canPlace(this.shiftClip.employeeId,date,start,end,null))return;
      this.shifts.push({id:uid(),employeeId:this.shiftClip.employeeId,date,start,end});
      this.commit();
    },
    pasteAtTarget(){ if(this.targetCell)this.pasteShiftTo(this.targetCell.date,this.targetCell.hour); },
    openAddAt(date,hour){
      if(!this.canEdit)return;
      this.editShift=null;
      const hh=String(hour).padStart(2,'0'), eh=String(Math.min(hour+1,23)).padStart(2,'0');
      this.shiftForm={employeeId:this.employees[0]?.id||'',date,start:hh+':00',end:eh+':00'};
      this.showShift=true;
    },
    addAtTarget(){ if(this.targetCell)this.openAddAt(this.targetCell.date,this.targetCell.hour); },
    // Drag & drop : déplacer un shift vers une autre case (jour/heure)
    onDragStart(s,e){ if(!this.canEdit){return;} this.dragShiftId=s.id; if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',s.id);}catch(_){}} },
    onDrop(date,hour){
      if(!this.canEdit||!this.dragShiftId)return;
      const s=this.shifts.find(x=>x.id===this.dragShiftId);this.dragShiftId=null;
      if(!s)return;
      const dur=parseTime(s.end)-parseTime(s.start);
      const start=fmtMin(hour*60), end=fmtMin(hour*60+dur);
      if(!this.canPlace(s.employeeId,date,start,end,s.id))return;
      s.date=date;s.start=start;s.end=end;
      this.commit();
    },
    isSelCell(eId,d){return this.selectedCell?.empId===eId&&this.selectedCell?.date===d;},
    isEdCell(eId,d){return this.editingCell?.empId===eId&&this.editingCell?.date===d;},
    isCopCell(eId,d){return this.copiedCell?.empId===eId&&this.copiedCell?.date===d;},
    isSelDay(d){return this.selDays.includes(d);},
    isCopDay(d){return this.copiedDay===d;},

    selectCell(eId,date){
      if(!this.canEdit)return;
      if(this.editingCell)this.commitCell();
      this.selDays=[]; this.selectedCell={empId:eId,date};
    },
    startEditCell(eId,date){
      if(!this.canEdit)return;
      this.selDays=[]; this.selectedCell={empId:eId,date};
      const s=this.shiftForCell(eId,date);
      this.cellForm=s?{start:s.start,end:s.end}:{start:'09:00',end:'17:00'};
      this.editingCell={empId:eId,date};
      this.$nextTick(()=>document.querySelector('.cse')?.focus());
    },
    commitCell(){
      if(!this.editingCell)return;
      const{empId,date}=this.editingCell,{start,end}=this.cellForm;
      if(start&&end){
        const ex=this.shiftForCell(empId,date);
        if(ex){const i=this.shifts.findIndex(s=>s.id===ex.id);if(i>=0)this.shifts[i]={...this.shifts[i],start,end};}
        else this.shifts.push({id:uid(),employeeId:empId,date,start,end});
        this.commit();
      }
      this.editingCell=null;
    },
    cancelCell(){this.editingCell=null;},

    // ── Cell clipboard ──
    clearCell(eId,d){const s=this.shiftForCell(eId,d);if(s){this.shifts=this.shifts.filter(x=>x.id!==s.id);this.commit();}},
    copyCell(eId,d){const s=this.shiftForCell(eId,d);if(s){this.clipboard={start:s.start,end:s.end};this.copiedCell={empId:eId,date:d};}},
    cutCell(eId,d){this.copyCell(eId,d);this.clearCell(eId,d);this.copiedCell=null;},
    pasteCell(eId,d){
      if(!this.clipboard)return;
      const ex=this.shiftForCell(eId,d);
      if(ex){const i=this.shifts.findIndex(s=>s.id===ex.id);if(i>=0)this.shifts[i]={...this.shifts[i],...this.clipboard};}
      else this.shifts.push({id:uid(),employeeId:eId,date:d,...this.clipboard});
      this.commit();
    },

    // ── Day clipboard ──
    // ── Sélection multi-jours (toggle) ──
    selectDay(d){if(!this.canEdit)return;this.selShiftId=null;this.selectedCell=null;this.targetCell=null;
      const i=this.selDays.indexOf(d);
      if(i>=0)this.selDays.splice(i,1);else this.selDays.push(d);
    },
    selectWeek(){if(!this.canEdit)return;this.selShiftId=null;this.selectedCell=null;this.selDays=this.weekDays.map(d=>d.ds);},
    // Copie les jours sélectionnés (mémorise la position dans la semaine, lun=0 … dim=6)
    copyDaysSel(){
      if(!this.selDays.length)return;
      const items=this.selDays.map(ds=>({
        idx:this.weekDays.findIndex(d=>d.ds===ds),
        shifts:(this.shiftsMap[ds]||[]).map(s=>({employeeId:s.employeeId,start:s.start,end:s.end})),
      })).filter(x=>x.idx>=0).sort((a,b)=>a.idx-b.idx);
      this.daysClip={items,count:items.length};
    },
    copyWeek(){this.selectWeek();this.copyDaysSel();},
    // Colle sur la semaine affichée, en respectant le jour de la semaine d'origine
    pasteDaysSel(){
      if(!this.daysClip)return;
      this.daysClip.items.forEach(it=>{
        const day=this.weekDays[it.idx];if(!day)return;
        this.shifts=this.shifts.filter(s=>s.date!==day.ds);
        it.shifts.forEach(s=>this.shifts.push({id:uid(),employeeId:s.employeeId,date:day.ds,start:s.start,end:s.end}));
      });
      this.commit();
    },
    clearDaysSel(){if(!this.selDays.length)return;const set=new Set(this.selDays);this.shifts=this.shifts.filter(s=>!set.has(s.date));this.commit();},
    // Sauter directement à la semaine d'une date
    goToWeek(){
      if(!this.weekJump)return;
      const mon=d=>{const x=new Date(d);const dow=x.getDay(),back=dow===0?6:dow-1;x.setDate(x.getDate()-back);x.setHours(0,0,0,0);return x;};
      const mb=mon(new Date()),mt=mon(new Date(this.weekJump+'T00:00:00'));
      this.weekOffset=Math.round((mt-mb)/(7*86400000));
      this.clearSel();
    },

    // ── Modèle de semaine ──
    saveWeekAsTemplate(){
      const t=[];
      this.weekDays.forEach((d,i)=>{(this.shiftsMap[d.ds]||[]).forEach(s=>t.push({dow:i,employeeId:s.employeeId,start:s.start,end:s.end}));});
      this.weekTemplate=t;this.commit();
      alert('Modèle enregistré ('+t.length+' shifts) — applicable aux autres semaines.');
    },
    applyTemplate(){
      const tpl=(this.weekTemplate&&this.weekTemplate.length)?this.weekTemplate:SEED_TEMPLATE;
      if(!tpl.length){alert('Aucun modèle enregistré. Arrange une semaine puis « Enreg. modèle ».');return;}
      const hasShifts=this.weekDays.some(d=>(this.shiftsMap[d.ds]||[]).length);
      let replace=false;
      if(hasShifts){
        replace=confirm('Cette semaine contient déjà des shifts.\n\nOK = REMPLACER par le modèle\nAnnuler = ajouter seulement les manquants');
      }
      if(replace){const set=new Set(this.weekDays.map(d=>d.ds));this.shifts=this.shifts.filter(s=>!set.has(s.date));}
      let added=0,skipped=0;
      tpl.forEach(it=>{
        const day=this.weekDays[it.dow];if(!day)return;
        if(this.overlaps(it.employeeId,day.ds,it.start,it.end,null)||this.onLeave(it.employeeId,day.ds)){skipped++;return;}
        this.shifts.push({id:uid(),employeeId:it.employeeId,date:day.ds,start:it.start,end:it.end});added++;
      });
      this.commit();
      alert(added+' shift(s) ajouté(s)'+(skipped?', '+skipped+' ignoré(s) (conflit/congé)':'')+'.');
    },
    // Effacer les shifts après une date (limiter le planning)
    purgeShiftsAfter(){
      const d=this.purgeDate;if(!d)return;
      const n=this.shifts.filter(s=>s.date>d).length;
      if(!n){alert('Aucun shift après le '+fmtShort(d)+'.');return;}
      if(!confirm('Effacer '+n+' shift(s) après le '+fmtShort(d)+' ? (annulable par Ctrl+Z)'))return;
      this.shifts=this.shifts.filter(s=>s.date<=d);
      this.commit();
    },
    // ── Export iCal (.ics) ──
    exportICS(all){
      const list=this.shifts.filter(s=>all?true:s.employeeId===this.user.id);
      if(!list.length){alert('Aucun shift à exporter.');return;}
      const dt=(date,t)=>date.replace(/-/g,'')+'T'+t.replace(':','')+'00';
      const esc=s=>String(s).replace(/([,;\\])/g,'\\$1');
      let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//CoffeeShift//FR\r\nCALSCALE:GREGORIAN\r\n';
      list.forEach(s=>{
        ics+='BEGIN:VEVENT\r\n'
          +'UID:'+s.id+'@coffeeshift\r\n'
          +'DTSTART:'+dt(s.date,s.start)+'\r\n'
          +'DTEND:'+dt(s.date,s.end)+'\r\n'
          +'SUMMARY:'+esc('Shift '+this.empName(s.employeeId))+'\r\n'
          +'END:VEVENT\r\n';
      });
      ics+='END:VCALENDAR';
      const blob=new Blob([ics],{type:'text/calendar'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download='coffeeshift'+(all?'-equipe':'-'+this.user.id)+'.ics';
      document.body.appendChild(a);a.click();a.remove();
    },
    // Lien d'abonnement (calendrier qui se met à jour tout seul, via l'Edge Function Supabase)
    subscribeCal(all){
      const u=all?'all':this.user.id;
      const url=SUPA_URL+'/functions/v1/calendar?emp='+u;
      try{navigator.clipboard&&navigator.clipboard.writeText(url);}catch(e){}
      prompt('Lien d\'abonnement (copié) — à ajouter dans ton agenda via « S\'abonner à un calendrier par URL » :',url);
    },

    // ── Keyboard ──
    handleKeydown(e){
      if(!this.user)return;
      const ae=document.activeElement, typing=ae&&['INPUT','TEXTAREA','SELECT'].includes(ae.tagName);
      const gctrl=e.ctrlKey||e.metaKey;
      // Global undo / redo (Google-Sheets style), disabled while typing in a field
      if(gctrl&&!typing){
        const k=e.key.toLowerCase();
        if(k==='z'&&!e.shiftKey){e.preventDefault();this.undo();return;}
        if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();this.redo();return;}
      }
      if(!this.canEdit||this.view!=='planning'||this.planView!=='week')return;
      if(this.editingCell){if(e.key==='Escape'){e.preventDefault();this.cancelCell();}return;}
      const ctrl=e.ctrlKey||e.metaKey;
      // Flèches ← → : changer de semaine quand rien n'est sélectionné
      if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&!this.selShiftId&&!this.selDays.length){
        e.preventDefault();this.targetCell=null;
        e.key==='ArrowLeft'?this.prevWeek():this.nextWeek();return;
      }
      if(this.targetCell){
        if(ctrl&&e.key.toLowerCase()==='v'){e.preventDefault();this.pasteAtTarget();return;}
        if(e.key==='Enter'){e.preventDefault();this.addAtTarget();return;}
        if(e.key==='Escape'){this.targetCell=null;return;}
      }
      if(this.selShiftId){
        if(ctrl&&e.key.toLowerCase()==='c'){e.preventDefault();this.copyShiftSel();return;}
        if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();this.deleteSelShift();return;}
        if(e.key==='Escape'){e.preventDefault();this.selShiftId=null;return;}
        return;
      }
      if(this.selDays.length){
        if(ctrl&&e.key.toLowerCase()==='c'){e.preventDefault();this.copyDaysSel();return;}
        if(ctrl&&e.key.toLowerCase()==='v'){e.preventDefault();this.pasteDaysSel();return;}
        if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();this.clearDaysSel();return;}
        if(e.key==='Escape'){this.selDays=[];return;}
        return;
      }
      if(!this.selectedCell)return;
      const{empId,date}=this.selectedCell;
      const ei=this.employees.findIndex(emp=>emp.id===empId),di=this.weekDays.findIndex(d=>d.ds===date);
      if(ctrl){if(e.key==='c'){e.preventDefault();this.copyCell(empId,date);}else if(e.key==='x'){e.preventDefault();this.cutCell(empId,date);}else if(e.key==='v'){e.preventDefault();this.pasteCell(empId,date);}return;}
      if(e.key==='ArrowUp'&&ei>0){e.preventDefault();this.selectedCell={empId:this.employees[ei-1].id,date};}
      else if(e.key==='ArrowDown'&&ei<this.employees.length-1){e.preventDefault();this.selectedCell={empId:this.employees[ei+1].id,date};}
      else if(e.key==='ArrowLeft'&&di>0){e.preventDefault();this.selectedCell={empId,date:this.weekDays[di-1].ds};}
      else if(e.key==='ArrowRight'&&di<6){e.preventDefault();this.selectedCell={empId,date:this.weekDays[di+1].ds};}
      else if(e.key==='Enter'||e.key==='F2'){e.preventDefault();this.startEditCell(empId,date);}
      else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();this.clearCell(empId,date);}
      else if(e.key==='Escape')this.selectedCell=null;
    },

    // ── Shift CRUD (month view) ──
    openAddShift(date){this.editShift=null;this.shiftForm={employeeId:this.employees[0]?.id||'',date:date||todayStr(),start:'09:00',end:'17:00'};this.showShift=true;},
    openEditShift(s){this.editShift=s;this.shiftForm={...s};this.showShift=true;},
    saveShift(){
      const f=this.shiftForm;
      if(!f.employeeId||!f.date||!f.start||!f.end)return;
      if(parseTime(f.end)<=parseTime(f.start)){alert('L\'heure de fin doit être après le début.');return;}
      if(!this.canPlace(f.employeeId,f.date,f.start,f.end,this.editShift?this.editShift.id:null))return;
      if(this.editShift){const i=this.shifts.findIndex(s=>s.id===this.editShift.id);if(i>=0)this.shifts[i]={...this.shifts[i],...f};}
      else this.shifts.push({id:uid(),...f});
      this.commit();this.showShift=false;
    },
    deleteShift(id){if(!confirm('Supprimer ce shift ?'))return;this.shifts=this.shifts.filter(s=>s.id!==id);this.commit();},

    // ── Leave ──
    openLeave(){this.leaveForm={dateFrom:todayStr(),dateTo:todayStr(),type:'CP',note:''};this.showLeave=true;},
    submitLeave(){
      const{dateFrom,dateTo,type,note}=this.leaveForm;
      if(!dateFrom||!dateTo)return;
      const from=dateFrom<=dateTo?dateFrom:dateTo,to=dateFrom<=dateTo?dateTo:dateFrom;
      const dpw=+this.user.daysPerWeek||5;   // jours travaillés / semaine = plafond de CP décomptés par semaine
      const all=datesInRange(from,to);
      const hasShift=date=>(this.shiftsMap[date]||[]).some(s=>s.employeeId===this.user.id);
      // Plafond CP par semaine = dpw, en priorisant les jours avec shift
      const byWeek={};
      all.forEach(d=>{(byWeek[mondayKey(d)]=byWeek[mondayKey(d)]||[]).push(d);});
      const cpSet=new Set();
      Object.values(byWeek).forEach(days=>{
        const ordered=[...days.filter(hasShift),...days.filter(d=>!hasShift(d))];
        ordered.slice(0,dpw).forEach(d=>cpSet.add(d));
      });
      // On crée une demande par jour qui a un shift (à remplacer) OU qui compte un CP
      const dates=all.filter(d=>hasShift(d)||cpSet.has(d));
      if(!dates.length){alert('Rien à poser sur cette période.');return;}
      const groupId=dates.length>1?uid():null;
      const waLines=[];
      dates.forEach(date=>{
        const dayS=this.shiftsMap[date]||[],myShift=dayS.find(s=>s.employeeId===this.user.id);
        const shifted=new Set(dayS.map(s=>s.employeeId)),avail=this.employees.filter(e=>e.id!==this.user.id&&!shifted.has(e.id));
        this.requests.push({id:uid(),groupId,groupFrom:from,groupTo:to,employeeId:this.user.id,dateFrom:date,dateTo:date,type,note,cp:cpSet.has(date),
          status:myShift?'pending_swap':'pending',proposedTo:myShift?avail.map(e=>e.id):[],swapDecisions:{},myShiftId:myShift?.id||null,at:todayStr()});
        if(myShift){
          if(avail.length>0){
            avail.forEach(e=>this.notify(e.id,`🔄 ${this.user.name} cherche un remplaçant le ${fmtShort(date)} (${myShift.start}–${myShift.end}). Tu es dispo → réponds dans CoffeeShift !`));
            waLines.push(`• ${fmtShort(date)} ${myShift.start}–${myShift.end} → ${avail.map(e=>e.name).join(', ')}`);
          } else {
            this.notify('dan',`⚠️ ${this.user.name} : aucun remplaçant dispo le ${fmtShort(date)}. Décision requise.`);
          }
        } else {
          this.notify('dan',`📋 ${this.user.name} pose un ${this.typeLabel(type)} le ${fmtShort(date)} (jour sans shift).`);
        }
      });
      if(waLines.length>0){
        this.waMsg=(waLines.length>1
          ? `Salut ! ${this.user.name} cherche des remplaçants :\n`+waLines.join('\n')
          : `Salut ! ${this.user.name} cherche un remplaçant :\n`+waLines[0])
          +`\n\nMerci de répondre sur CoffeeShift ☕`;
        this.showWA=true;
      }
      this.commit();this.showLeave=false;
    },
    respondSwap(rid,accept){
      const req=this.requests.find(r=>r.id===rid);if(!req)return;
      req.swapDecisions[this.user.id]=accept?'yes':'no';
      if(accept){
        const s=this.shifts.find(x=>x.id===req.myShiftId);if(s){s.coveredFor=req.employeeId;s.employeeId=this.user.id;this.save();}
        req.status='approved';req.swapBy=this.user.id;
        if(req.cp!==false)this.adjustLeave(req.employeeId,req.type,-1);
        const d=req.dateFrom||req.date;
        this.notify(req.employeeId,`✅ ${this.user.name} prend ton shift du ${fmtShort(d)} ! Ton jour off est accordé.`);
        this.notify('dan',`✅ Swap OK : ${this.user.name} reprend le créneau de ${this.empName(req.employeeId)} le ${fmtShort(d)}.`);
      } else {
        const allNo=(req.proposedTo||[]).every(id=>req.swapDecisions[id]==='no');
        if(allNo){
          req.status='needs_manager';
          const d=req.dateFrom||req.date;
          this.notify('dan',`🚨 Personne ne peut couvrir ${this.empName(req.employeeId)} le ${fmtShort(d)}. Décision manuelle requise.`);
          this.notify(req.employeeId,`😕 Aucun collègue disponible pour le ${fmtShort(d)}. Le manager va décider.`);
        }
      }
      this.commit();
    },
    managerDecide(rid,approve){
      const req=this.requests.find(r=>r.id===rid);if(!req)return;
      req.status=approve?'approved':'refused';
      if(approve){
        const dates=datesInRange(req.dateFrom||req.date,req.dateTo||req.dateFrom||req.date);
        if(req.cp!==false)this.adjustLeave(req.employeeId,req.type,-dates.length);   // ne décompte pas les jours hors plafond
        // Retirer la personne du planning sur les jours validés (créneau vacant), en mémorisant pour pouvoir annuler
        const removed=this.shifts.filter(s=>s.employeeId===req.employeeId&&dates.includes(s.date));
        if(removed.length){req.removedShifts=removed.map(s=>({...s}));this.shifts=this.shifts.filter(s=>!(s.employeeId===req.employeeId&&dates.includes(s.date)));}
      }
      const d=req.dateFrom||req.date,lbl=req.dateFrom!==req.dateTo?fmtRange(req.dateFrom,req.dateTo):fmtShort(d);
      this.notify(req.employeeId,approve?`✅ Ton absence (${lbl}) a été validée.`:`❌ Ton absence (${lbl}) a été refusée.`);
      this.commit();
    },
    // Solde concerné par un type d'absence ; null pour sans solde / maladie
    balField(type){return type==='CP'?'cpBalance':null;},
    adjustLeave(uid,type,delta){const f=this.balField(type);if(!f)return;const u=this.users.find(x=>x.id===uid);if(u)u[f]=Math.round(((u[f]||0)+delta)*10)/10;this.save();},   // négatif autorisé (CP pris en avance)

    // ── Admin : annuler / revenir sur une décision ──
    reverseRequestEffects(req){
      // recréditer le solde CP si l'absence avait été accordée
      if(req.status==='approved'&&req.cp!==false){
        const n=datesInRange(req.dateFrom||req.date,req.dateTo||req.dateFrom||req.date).length;
        this.adjustLeave(req.employeeId,req.type,+n);
      }
      // si un échange avait réattribué le shift, le rendre au demandeur
      if(req.swapBy&&req.myShiftId){
        const s=this.shifts.find(x=>x.id===req.myShiftId);
        if(s&&s.employeeId===req.swapBy){s.employeeId=req.employeeId;delete s.coveredFor;}
      }
      // si la validation avait retiré des shifts du planning, les restaurer
      if(req.removedShifts&&req.removedShifts.length){
        req.removedShifts.forEach(s=>{if(!this.shifts.some(x=>x.id===s.id))this.shifts.push({...s});});
        req.removedShifts=null;
      }
    },
    revertDecision(rid){
      const req=this.requests.find(r=>r.id===rid);if(!req)return;
      this.reverseRequestEffects(req);
      req.swapBy=null;req.swapDecisions={};
      if(req.myShiftId){
        req.status='pending_swap';
        const date=req.dateFrom||req.date,shifted=new Set((this.shiftsMap[date]||[]).map(s=>s.employeeId));
        req.proposedTo=this.employees.filter(e=>e.id!==req.employeeId&&!shifted.has(e.id)).map(e=>e.id);
      } else { req.status='pending'; }
      const lbl=req.dateFrom!==req.dateTo?fmtRange(req.dateFrom,req.dateTo):fmtShort(req.dateFrom||req.date);
      this.notify(req.employeeId,`↩️ Ta demande (${lbl}) est de nouveau en attente — décision annulée par l'admin.`);
      this.commit();
    },
    cancelRequest(rid){
      const req=this.requests.find(r=>r.id===rid);if(!req)return;
      if(!confirm('Annuler et supprimer cette demande d\'absence ?'))return;
      this.reverseRequestEffects(req);
      const lbl=req.dateFrom!==req.dateTo?fmtRange(req.dateFrom,req.dateTo):fmtShort(req.dateFrom||req.date);
      this.requests=this.requests.filter(r=>r.id!==rid);
      this.notify(req.employeeId,`🗑 Ta demande (${lbl}) a été annulée par l'admin.`);
      this.commit();
    },
    // Un employé annule sa propre demande (recrédite le CP / restitue le shift si elle était accordée)
    cancelOwn(rid){
      const req=this.requests.find(r=>r.id===rid);if(!req)return;
      if(req.employeeId!==this.user.id&&!this.canAdmin)return;
      if(!confirm('Annuler ta demande de congé ?'))return;
      const hadSwap=req.swapBy;
      this.reverseRequestEffects(req);
      const lbl=req.dateFrom!==req.dateTo?fmtRange(req.dateFrom,req.dateTo):fmtShort(req.dateFrom||req.date);
      this.requests=this.requests.filter(r=>r.id!==rid);
      this.notify('dan',`🗑 ${this.user.name} a annulé sa demande de congé (${lbl}).`);
      this.notify('julien',`🗑 ${this.user.name} a annulé sa demande de congé (${lbl}).`);
      if(hadSwap&&hadSwap!==this.user.id)this.notify(hadSwap,`ℹ️ ${this.user.name} a annulé son congé (${lbl}) : le shift lui revient.`);
      this.commit();
    },

    // ── Se positionner sur un shift à remplacer ──
    claimShift(rid){
      const req=this.requests.find(r=>r.id===rid);if(!req)return;
      const sh=this.shifts.find(s=>s.id===req.myShiftId);
      const d=req.dateFrom||req.date;
      if(sh&&this.onLeave(this.user.id,d)){alert('Tu es en absence validée le '+fmtShort(d)+'.');return;}
      if(sh&&this.overlaps(this.user.id,d,sh.start,sh.end,sh.id)){alert('Tu as déjà un shift qui chevauche ce créneau.');return;}
      if(!confirm(`Prendre le shift de ${this.empName(req.employeeId)} le ${fmtShort(d)}${sh?' ('+sh.start+'–'+sh.end+')':''} ?`))return;
      if(sh){sh.coveredFor=req.employeeId;sh.employeeId=this.user.id;}
      req.swapDecisions=req.swapDecisions||{};req.swapDecisions[this.user.id]='yes';
      req.status='approved';req.swapBy=this.user.id;
      if(req.cp!==false)this.adjustLeave(req.employeeId,req.type,-1);
      this.notify(req.employeeId,`✅ ${this.user.name} prend ton shift du ${fmtShort(d)} ! Ton jour off est accordé.`);
      this.notify('dan',`✅ ${this.user.name} se positionne sur le shift de ${this.empName(req.employeeId)} le ${fmtShort(d)}.`);
      this.commit();
    },

    // ── Suggestions employés ──
    openSugg(){this.suggForm={kind:'shift',date:todayStr(),shiftId:'',start:'',end:'',title:'',atelierType:'atelier',hours:2,note:''};this.showSugg=true;},
    onSuggShiftPick(){
      const sh=this.shifts.find(s=>s.id===this.suggForm.shiftId);
      if(sh){this.suggForm.start=sh.start;this.suggForm.end=sh.end;this.suggForm.date=sh.date;}
    },
    submitSugg(){
      const f=this.suggForm;
      if(f.kind==='shift'){
        if(!f.shiftId||!f.start||!f.end)return;
        const sh=this.shifts.find(s=>s.id===f.shiftId);
        this.suggestions.push({id:uid(),employeeId:this.user.id,kind:'shift',shiftId:f.shiftId,date:sh?sh.date:f.date,
          start:f.start,end:f.end,oldStart:sh?.start||'',oldEnd:sh?.end||'',note:f.note,status:'pending',at:todayStr()});
        this.notify('dan',`💡 ${this.user.name} propose d'ajuster son shift du ${fmtShort(sh?sh.date:f.date)} → ${f.start}–${f.end}.`);
      } else {
        if(!f.title||!f.date)return;
        this.suggestions.push({id:uid(),employeeId:this.user.id,kind:'atelier',date:f.date,title:f.title,
          atelierType:f.atelierType,hours:+f.hours,note:f.note,status:'pending',at:todayStr()});
        this.notify('dan',`💡 ${this.user.name} propose un ${this.atTypeLabel(f.atelierType)} le ${fmtShort(f.date)} : ${f.title}.`);
      }
      this.commit();this.showSugg=false;
    },
    decideSugg(id,approve){
      const s=this.suggestions.find(x=>x.id===id);if(!s)return;
      s.status=approve?'approved':'refused';
      if(approve){
        if(s.kind==='shift'){
          const sh=this.shifts.find(x=>x.id===s.shiftId);
          if(sh){
            if(this.overlaps(sh.employeeId,sh.date,s.start,s.end,sh.id)){alert(this.empName(sh.employeeId)+' aurait un chevauchement avec ce nouvel horaire — non appliqué.');s.status='pending';return;}
            sh.start=s.start;sh.end=s.end;
          }
          this.notify(s.employeeId,`✅ Ton horaire du ${fmtShort(s.date)} a été ajusté à ${s.start}–${s.end}.`);
        } else {
          this.ateliers.push({id:uid(),employeeId:s.employeeId,date:s.date,title:s.title,hours:+s.hours,type:s.atelierType,note:s.note||''});
          this.notify(s.employeeId,`✅ Ta suggestion « ${s.title} » a été validée et ajoutée aux ateliers.`);
        }
      } else {
        this.notify(s.employeeId,`❌ Ta suggestion a été refusée.`);
      }
      this.commit();
    },
    deleteSugg(id){if(!confirm('Supprimer cette suggestion ?'))return;this.suggestions=this.suggestions.filter(x=>x.id!==id);this.commit();},

    // ── Notifications ──
    notify(userId,message){this.notifications.push({id:uid(),userId,message,read:false,at:todayStr()});this.save();},
    markRead(){this.notifications.forEach(n=>{if(n.userId===this.user?.id)n.read=true;});this.save();},

    // ── Admin ──
    startEdit(emp){this.editEmp=emp;this.empForm={...emp};if(this.empForm.cpRate==null)this.empForm.cpRate=this.cpPerMonth;if(this.empForm.daysPerWeek==null)this.empForm.daysPerWeek=5;},
    cancelEdit(){this.editEmp=null;},
    saveEmp(){
      const i=this.users.findIndex(u=>u.id===this.editEmp.id);
      if(i>=0)this.users[i]={...this.users[i],...this.empForm,hoursPerWeek:+this.empForm.hoursPerWeek,cpBalance:+this.empForm.cpBalance,wage:+(this.empForm.wage||0),cpRate:+(this.empForm.cpRate||0),daysPerWeek:+(this.empForm.daysPerWeek||5)};
      this.commit();this.editEmp=null;
    },
    // Créer un employé
    slugId(name){let b=(name||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'').slice(0,12)||'emp';let id=b,i=2;while(this.users.some(u=>u.id===id)){id=b+i;i++;}return id;},
    openNewEmp(){this.editEmp=null;this.newEmp={name:'',email:'',contractType:'CDI',hoursPerWeek:35,daysPerWeek:5,cpBalance:0,wage:12,cpRate:this.cpPerMonth,hasAteliers:false};this.showNewEmp=true;},
    createEmp(){
      const f=this.newEmp;
      if(!f.name||!f.name.trim()){alert('Le nom est requis.');return;}
      const id=this.slugId(f.name.trim());
      this.users.push({id,name:f.name.trim(),email:f.email||'',role:'employee',
        hoursPerWeek:+f.hoursPerWeek||0,daysPerWeek:+f.daysPerWeek||5,cpBalance:+f.cpBalance||0,
        wage:+f.wage||0,cpRate:+f.cpRate||0,contractType:f.contractType||'CDI',
        hasAteliers:!!f.hasAteliers,cpAccruedThru:monthKey(new Date())});
      this.commit();this.showNewEmp=false;
      alert('Employé créé : '+f.name.trim()+' (identifiant de connexion : '+id+').');
    },
    deleteEmp(emp){
      if(!confirm('Supprimer '+emp.name+' ?\nSes shifts et heures corpo seront aussi retirés. (annulable par Ctrl+Z)'))return;
      this.users=this.users.filter(u=>u.id!==emp.id);
      this.shifts=this.shifts.filter(s=>s.employeeId!==emp.id);
      this.corpo=this.corpo.filter(c=>c.employeeId!==emp.id);
      if(this.editEmp&&this.editEmp.id===emp.id)this.editEmp=null;
      this.commit();
    },

    // ── Reports ──
    prevRep(){if(this.repMonth===0){this.repMonth=11;this.repYear--;}else this.repMonth--;},
    nextRep(){if(this.repMonth===11){this.repMonth=0;this.repYear++;}else this.repMonth++;},
    saveTips(){
      const v=parseFloat(this.tipsInput);if(isNaN(v)||v<0)return;
      const idx=this.tips.findIndex(t=>t.year===this.repYear&&t.month===this.repMonth);
      if(idx>=0)this.tips[idx].amount=v;
      else this.tips.push({id:uid(),year:this.repYear,month:this.repMonth,amount:v});
      this.commit();
      this.tipsInput='';
    },
    currentTipsAmount(){const e=this.tips.find(t=>t.year===this.repYear&&t.month===this.repMonth);return e?e.amount:null;},

    // ── Pourboires : suivi des versements ──
    tipsEntry(){return this.tips.find(t=>t.year===this.repYear&&t.month===this.repMonth);},
    tipPaid(empId){const e=this.tipsEntry();return !!(e&&e.paid&&e.paid[empId]);},
    tipPaidAt(empId){const e=this.tipsEntry();return (e&&e.paid&&e.paid[empId]&&e.paid[empId].at)||'';},
    toggleTipPaid(empId,share){
      const e=this.tipsEntry();if(!e)return;
      if(!e.paid)e.paid={};
      if(e.paid[empId])delete e.paid[empId];
      else e.paid[empId]={at:todayStr(),amount:share};
      this.commit();
    },
    setAllTipsPaid(paid){
      const e=this.tipsEntry();if(!e)return;
      if(!e.paid)e.paid={};
      if(paid)this.tipsData.employees.forEach(d=>{if(!e.paid[d.emp.id])e.paid[d.emp.id]={at:todayStr(),amount:d.share};});
      else e.paid={};
      this.commit();
    },

    // ── Ateliers ──
    prevAt(){if(this.atMonth===0){this.atMonth=11;this.atYear--;}else this.atMonth--;},
    nextAt(){if(this.atMonth===11){this.atMonth=0;this.atYear++;}else this.atMonth++;},
    openAtForm(){
      this.editAt=null;
      const who=this.isEmployee?this.user.id:(this.employees[0]?.id||'');
      this.atForm={employeeId:who,date:todayStr(),title:'',hours:2,type:'atelier',note:''};
      this.showAtForm=true;
    },
    openEditAt(a){this.editAt=a;this.atForm={...a};this.showAtForm=true;},
    saveAt(){
      if(!this.atForm.title||!this.atForm.date)return;
      if(this.isEmployee)this.atForm.employeeId=this.user.id;   // un employé ne crée que pour lui-même
      const pend=this.isEmployee;   // saisie employé = à valider par Dan/Julien ; saisie admin = direct
      if(this.editAt){const i=this.ateliers.findIndex(a=>a.id===this.editAt.id);if(i>=0)this.ateliers[i]={...this.ateliers[i],...this.atForm,hours:+this.atForm.hours,pending:pend};}
      else this.ateliers.push({id:uid(),...this.atForm,hours:+this.atForm.hours,pending:pend});
      if(pend)this.notify('dan',`🎓 ${this.user.name} a ajouté un atelier à valider : « ${this.atForm.title} » le ${fmtShort(this.atForm.date)}.`);
      this.commit();this.showAtForm=false;
    },
    deleteAt(id){if(!confirm('Supprimer cet atelier ?'))return;this.ateliers=this.ateliers.filter(a=>a.id!==id);this.commit();},
    validateAt(id){
      const a=this.ateliers.find(x=>x.id===id);if(!a)return;
      a.pending=false;
      this.notify(a.employeeId,`✅ Ton atelier « ${a.title} » du ${fmtShort(a.date)} a été validé.`);
      this.commit();
    },

    // ── Corpo (Orianna) ──
    prevCorpo(){if(this.corpoMonth===0){this.corpoMonth=11;this.corpoYear--;}else this.corpoMonth--;},
    nextCorpo(){if(this.corpoMonth===11){this.corpoMonth=0;this.corpoYear++;}else this.corpoMonth++;},
    // Génère un créneau 9h30-18h30 pour chaque mardi du mois affiché (sans doublon)
    prefillCorpoTuesdays(){
      const{corpoYear:y,corpoMonth:m}=this;
      const existing=new Set(this.corpo.filter(c=>c.employeeId==='orianna').map(c=>c.date));
      let added=0;
      const last=new Date(y,m+1,0).getDate();
      for(let d=1;d<=last;d++){
        const dt=new Date(y,m,d);
        if(dt.getDay()===2){               // mardi
          const ds=ymd(dt);
          if(!existing.has(ds)){this.corpo.push({id:uid(),employeeId:'orianna',date:ds,start:'09:30',end:'18:30'});added++;}
        }
      }
      if(added)this.commit();
    },
    addCorpo(){
      const ds=this.corpoAddDate;if(!ds)return;
      this.corpo.push({id:uid(),employeeId:'orianna',date:ds,start:'09:30',end:'18:30'});
      this.commit();
    },
    updateCorpo(c){ if(parseTime(c.end)<=parseTime(c.start)){alert('L\'heure de fin doit être après le début.');return;} this.commit(); },
    deleteCorpo(id){this.corpo=this.corpo.filter(c=>c.id!==id);this.commit();},

    // ── Mode démo ──
    toggleDemo(){
      const on=!this.demoMode;
      if(!on&&!confirm('Désactiver le mode démo ?\nLa plateforme devient officielle : chaque personne devra créer son mot de passe à la prochaine connexion.'))return;
      this.demoMode=on;this.save();   // global : enregistré et synchronisé pour tout le monde
    },

    // ── Helpers ──
    empName(id){return this.users.find(u=>u.id===id)?.name||id;},
    shiftById(id){return this.shifts.find(s=>s.id===id)||null;},
    hrs(start,end){return diffH(start,end);},
    // Heures sup/complémentaires comptées À LA SEMAINE (lun→dim), pour les semaines dont le lundi tombe dans le mois.
    // = somme des dépassements hebdo au-delà du contrat (0 si chaque semaine respecte le contrat).
    weeklyExtra(empId,y,m){
      const wc=+(this.users.find(u=>u.id===empId)?.hoursPerWeek)||0;
      const weeks={};
      const add=(date,h)=>{const d=new Date(date+'T00:00:00');const back=(d.getDay()+6)%7;d.setDate(d.getDate()-back);weeks[ymd(d)]=(weeks[ymd(d)]||0)+h;};
      this.shifts.forEach(s=>{if(s.employeeId===empId)add(s.date,diffH(s.start,s.end));});
      this.corpo.forEach(c=>{if(c.employeeId===empId)add(c.date,diffH(c.start,c.end));});
      this.ateliers.forEach(a=>{if(a.employeeId===empId&&a.pending!==true)add(a.date,+a.hours||0);});
      let extra=0;
      Object.keys(weeks).forEach(k=>{const mon=new Date(k+'T00:00:00');if(mon.getFullYear()===y&&mon.getMonth()===m)extra+=Math.max(0,weeks[k]-wc);});
      return Math.round(extra*10)/10;
    },
    empColor, fmtLong, fmtShort, fmtRange,
    reqDateLabel(req){const f=req.dateFrom||req.date||'',t=req.dateTo||f;return fmtRange(f,t);},
    typeLabel(t){return{CP:'Congé Payé',sans_solde:'Sans solde',maladie:'Arrêt maladie'}[t]||t;},
    statusLabel(s){return{pending_swap:'Swap en attente',pending:'En attente',approved:'Accordé',refused:'Refusé',needs_manager:'Décision manager'}[s]||s;},
    statusClr(s){return{pending_swap:'bg-amber-100 text-amber-800',pending:'bg-gray-100 text-gray-600',approved:'bg-green-100 text-green-800',refused:'bg-red-100 text-red-700',needs_manager:'bg-orange-100 text-orange-800'}[s]||'bg-gray-100 text-gray-600';},
    contractClr(t){return t==='Freelance'?'bg-violet-50 text-violet-700':'bg-blue-50 text-blue-700';},
    atTypeLabel(t){return{atelier:'Atelier client',formation:'Formation équipe',autre:'Autre'}[t]||t;},
    atTypeClr(t){return{atelier:'bg-orange-50 text-orange-700',formation:'bg-blue-50 text-blue-700',autre:'bg-gray-100 text-gray-600'}[t]||'bg-gray-100 text-gray-600';},
    copyWA(){navigator.clipboard.writeText(this.waMsg).then(()=>alert('Copié !'));},
    fmt2(n){return(+n).toFixed(2);},
  },

      </div>
      <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer mt-3">
        <input type="checkbox" v-model="newEmp.hasAteliers" class="rounded"/><span>Accès Ateliers &amp; Formations</span>
      </label>
      <div class="flex gap-3 mt-5">
        <button @click="showNewEmp=false" class="flex-1 bg-gray-100 text-gray-600 py-3 rounded-2xl text-sm font-semibold">Annuler</button>
        <button @click="createEmp" class="flex-1 bg-green-600 text-white py-3 rounded-2xl text-sm font-semibold hover:bg-green-700 shadow-sm">Créer</button>
      </div>
    </div>
  </div>

  <!-- WHATSAPP MODAL -->
  <div v-if="showWA" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="modal-enter bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl">
      <div class="flex items-center gap-2 mb-3"><span class="text-2xl">📱</span><h3 class="font-bold text-gray-800">Message WhatsApp</h3></div>
      <textarea readonly rows="5" class="w-full border border-gray-200 bg-gray-50 rounded-2xl p-3 text-sm text-gray-700 resize-none focus:outline-none">{{waMsg}}</textarea>
      <div class="flex gap-3 mt-4">
        <button @click="showWA=false" class="flex-1 bg-gray-100 text-gray-600 py-3 rounded-2xl text-sm font-semibold">Fermer</button>
        <button @click="copyWA"       class="flex-1 bg-green-600 text-white py-3 rounded-2xl text-sm font-semibold hover:bg-green-700 shadow-sm">📋 Copier</button>
      </div>
    </div>
  </div>

</div>
  `,
}).mount('#app');
</script>
</body>
</html>
